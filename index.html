<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F4">
<title>陪玩计费账本</title>
<style>
*,*::before,*::after{box-sizing:border-box}
/* 【重要】下面这条不能删：.fld 用了 display:inline-flex，
   会盖掉浏览器默认的 [hidden]{display:none}，导致 hidden 属性失效 */
[hidden]{display:none!important}

/* ============ 奶油马卡龙 · 浅色 ============ */
:root{
  color-scheme:light;
  --paper:#FFF9F4;
  --dot:rgba(255,158,190,.20);
  --card:#FFFFFF;
  --panel:#FFF7FA;
  --ink:#584046;
  --ink2:#9A8189;
  --ink3:#C0AAB1;
  --line:#FFE3EC;
  --pink:#FF9EBE;
  --pink-ink:#D8547F;
  --pink-shadow:#EE7FA5;
  --pink-soft:#FFF0F5;
  --mint:#7BD8BC;
  --mint-ink:#1E9C7E;
  --mint-soft:#E9FAF4;
  --butter:#FFD98E;
  --butter-ink:#B37F0E;
  --butter-soft:#FFF8E8;
  --butter-line:#FFE9B8;
  --lilac:#B7A8F0;
  --lilac-ink:#7A66D6;
  --lilac-soft:#F2EFFF;
  --tape:rgba(123,216,188,.5);
  --outline:#5A4148;
  --danger:#D64B47;
  --danger-ink:#C93F3B;
  --danger-soft:#FFEFEE;
  --on-accent:#4A2B35;
  --shadow:0 16px 30px -20px rgba(232,100,143,.55);
  --shadow-sm:0 8px 16px -12px rgba(232,100,143,.5);
  --ring:0 0 0 4px rgba(255,158,190,.22);
  --r:26px;
  --r-sm:16px;
}

/* ============ 奶油马卡龙 · 深色 ============ */
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --paper:#221A20;
    --dot:rgba(255,158,190,.09);
    --card:#2E2429;
    --panel:#3A2C33;
    --ink:#F8ECF0;
    --ink2:#C0A6AF;
    --ink3:#8E767E;
    --line:#4B3540;
    --pink:#FF9EBE;
    --pink-ink:#FFB3CC;
    --pink-shadow:#8E4560;
    --pink-soft:#3B2531;
    --mint:#7BD8BC;
    --mint-ink:#7FE8CC;
    --mint-soft:#1B3832;
    --butter:#FFD98E;
    --butter-ink:#FFD98E;
    --butter-soft:#3A2F1B;
    --butter-line:#4E3F22;
    --lilac:#B7A8F0;
    --lilac-ink:#C3B8FF;
    --lilac-soft:#2A2440;
    --tape:rgba(123,216,188,.35);
    --outline:#6B4E58;
    --danger:#E4695F;
    --danger-ink:#FF9C93;
    --danger-soft:#3A2321;
    --on-accent:#3A1E28;
    --shadow:0 16px 30px -20px rgba(0,0,0,.9);
    --shadow-sm:0 8px 16px -12px rgba(0,0,0,.8);
    --ring:0 0 0 4px rgba(255,158,190,.18);
  }
}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  background-color:var(--paper);
  /* 波点纸 */
  background-image:
    radial-gradient(var(--dot) 1.7px,transparent 1.8px),
    radial-gradient(var(--dot) 1.7px,transparent 1.8px);
  background-size:26px 26px,26px 26px;
  background-position:0 0,13px 13px;
  padding:clamp(18px,3.4vw,42px) 16px calc(20px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";
  position:fixed;inset:-10% -10% auto -10%;height:76vh;z-index:-1;
  pointer-events:none;filter:blur(12px);
  background:
    radial-gradient(closest-side,rgba(255,158,190,.26),transparent 72%) 2% 10% / 48vw 48vw no-repeat,
    radial-gradient(closest-side,rgba(123,216,188,.24),transparent 72%) 94% 2% / 42vw 42vw no-repeat,
    radial-gradient(closest-side,rgba(183,168,240,.22),transparent 72%) 66% 62% / 46vw 46vw no-repeat;
}
button{font:inherit;touch-action:manipulation}
input,button{font-family:inherit}

.wrap{max-width:920px;margin:0 auto;position:relative}

/* ---------- 星星装饰 ---------- */
.sparkle{position:absolute;pointer-events:none;animation:twinkle 3.6s ease-in-out infinite}
.sp1{width:22px;top:2px;right:9%;color:var(--butter)}
.sp2{width:14px;top:62px;right:2%;color:var(--pink);animation-delay:.9s}
.sp3{width:16px;top:8px;right:26%;color:var(--lilac);animation-delay:1.7s}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.85) rotate(0)}50%{opacity:1;transform:scale(1.12) rotate(14deg)}}

/* ---------- 左上角名牌 ---------- */
.brand{margin:0 0 13px}
.brand-tag{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px 7px 16px;
  font-family:"Yuanti SC",YouYuan,"Hiragino Maru Gothic ProN","Microsoft YaHei UI",system-ui,sans-serif;
  font-size:16px;font-weight:700;
  letter-spacing:2.5px;
  color:#8A5A12;
  background:var(--butter);
  border:2.5px solid var(--outline);
  border-radius:999px;
  box-shadow:0 3px 0 rgba(138,90,18,.3);
  transform:rotate(-2.5deg);
}
.brand-tag svg{width:13px;height:13px;flex:0 0 auto;color:#C98A16}

/* ---------- 顶部 ---------- */
header{display:flex;align-items:center;gap:15px;margin-bottom:16px}
.mascot{
  width:74px;height:74px;flex:0 0 auto;
  object-fit:cover;border-radius:22px;
  border:3px solid var(--card);
  box-shadow:0 0 0 2.5px var(--butter),0 12px 20px -12px rgba(180,130,40,.75);
  animation:bob 5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(-3deg)}}

h1{margin:0;font-size:clamp(21px,3.6vw,27px);letter-spacing:.8px;position:relative;display:inline-block}
h1 .hl{position:relative;display:inline-block}
h1 .hl::after{
  content:"";position:absolute;left:-5px;right:-5px;bottom:1px;height:11px;z-index:-1;
  background:var(--butter);opacity:.75;border-radius:7px;transform:rotate(-1.2deg);
}

.hint{
  display:flex;align-items:flex-start;gap:9px;
  padding:11px 15px;margin:0 0 18px;
  font-size:12.5px;line-height:1.65;color:#8A6420;
  background:var(--butter-soft);
  border:2px solid var(--butter-line);
  border-radius:18px;
  box-shadow:var(--shadow-sm);
  transform:rotate(-.35deg);
}
@media (prefers-color-scheme:dark){.hint{color:var(--butter-ink)}}
.hint .dot{width:8px;height:8px;margin-top:6px;flex:0 0 auto;border-radius:50%;background:var(--butter);box-shadow:0 0 0 4px rgba(255,217,142,.28)}
.hint b{color:var(--butter-ink);font-weight:700}

/* ---------- 卡片列表 ---------- */
.list{display:flex;flex-direction:column;gap:16px}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 176px;
  gap:14px 18px;
  padding:16px 18px;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:box-shadow .2s,transform .2s,opacity .2s,border-color .2s;
}
.row:focus-within{border-color:var(--pink);box-shadow:var(--shadow),var(--ring)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:12px}

.row-top{display:flex;align-items:center;gap:10px}
.badge{
  width:32px;height:32px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:50%;
  font-size:12.5px;font-weight:800;letter-spacing:.3px;
  font-variant-numeric:tabular-nums;
  color:var(--pink-ink);background:var(--pink-soft);
  box-shadow:0 0 0 2.5px var(--card),0 0 0 4px var(--pink-soft);
  margin-left:2px;
}
.row:nth-child(3n+2) .badge{color:var(--mint-ink);background:var(--mint-soft);box-shadow:0 0 0 2.5px var(--card),0 0 0 4px var(--mint-soft)}
.row:nth-child(3n) .badge{color:var(--lilac-ink);background:var(--lilac-soft);box-shadow:0 0 0 2.5px var(--card),0 0 0 4px var(--lilac-soft)}

/* ---------- 输入控件 ---------- */
.inp{
  width:100%;min-width:0;
  padding:7px 11px;
  font-size:14px;color:var(--ink);
  background:var(--panel);
  border:2px solid transparent;
  border-radius:13px;
  font-variant-numeric:tabular-nums;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.inp:hover{border-color:var(--line)}
.inp:focus{outline:none;background:var(--card);border-color:var(--pink);box-shadow:var(--ring)}
.inp::placeholder{color:var(--ink3)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:.85}

.name{
  flex:1 1 auto;
  padding:4px 2px;
  font-size:15.5px;font-weight:700;
  background:transparent;border:0;border-bottom:2px dashed var(--line);
  border-radius:0;
}
.name:hover{background:transparent;border-color:var(--pink)}
.name:focus{background:transparent;border-bottom:2px solid var(--pink);box-shadow:none}

.del{
  width:32px;height:32px;flex:0 0 auto;margin-left:auto;
  display:grid;place-items:center;
  color:var(--ink3);background:transparent;
  border:2px solid transparent;border-radius:50%;
  cursor:pointer;transition:.15s;
}
.del:hover{color:var(--danger-ink);background:var(--danger-soft);transform:rotate(90deg)}

.row-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:11px 14px}
.fld{display:inline-flex;align-items:center;gap:6px;min-width:0}
.lbl{flex:0 0 auto;font-size:12.5px;color:var(--ink2);font-weight:600}
.unit{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.tilde{color:var(--pink);font-size:13px;font-weight:700}

.t-start,.t-end{width:112px}
.h-val{width:66px;text-align:center;font-weight:700}
.rate{width:80px;font-weight:700}
.fld-note{flex:1 1 150px}
.notev{min-width:110px}

/* ---------- 计费方式切换 ---------- */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--panel);border-radius:999px}
.seg-btn{
  padding:5px 13px;
  font-size:12.5px;font-weight:700;color:var(--ink2);
  background:transparent;border:0;border-radius:999px;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.seg-btn:hover{color:var(--pink-ink)}
.seg-btn.on{
  color:var(--on-accent);background:var(--pink);
  box-shadow:0 2.5px 0 var(--pink-shadow);
}

/* ---------- 时长加减 ---------- */
.step{display:inline-flex;align-items:center;gap:5px}
.mini{
  width:28px;height:28px;flex:0 0 auto;
  display:grid;place-items:center;
  font-size:16px;font-weight:700;line-height:1;color:var(--pink-ink);
  background:var(--pink-soft);border:0;border-radius:50%;
  box-shadow:0 2.5px 0 #FFD8E6;
  cursor:pointer;transition:.12s;
}
.mini:hover{background:var(--pink);color:var(--on-accent)}
.mini:active{transform:translateY(2.5px);box-shadow:0 0 0 #FFD8E6}

/* ---------- 单行结果（吊牌） ---------- */
.row-out{
  position:relative;
  grid-column:2;grid-row:1;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:12px 14px 12px 22px;
  text-align:right;
  background:var(--panel);
  border:2px dashed var(--line);
  border-radius:18px;
  transition:background .2s,border-color .2s;
}
.row-out::before{                     /* 吊牌上的小孔 */
  content:"";position:absolute;left:8px;top:50%;
  width:9px;height:9px;margin-top:-4.5px;
  border-radius:50%;background:var(--card);
  border:2px solid var(--line);
  transition:border-color .2s;
}
.row.has-val .row-out{background:var(--mint-soft);border-style:solid;border-color:var(--mint)}
.row.has-val .row-out::before{border-color:var(--mint)}
.out-dur{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.out-amt{
  font-size:24px;font-weight:800;letter-spacing:-.5px;
  color:var(--mint-ink);font-variant-numeric:tabular-nums;
  transform-origin:right center;
}
.out-amt .cur{margin-right:1px;font-size:14px;font-weight:800}
.out-amt.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.out-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin-top:3px}
.tag{
  padding:2px 8px;border-radius:999px;white-space:nowrap;
  font-size:10.5px;font-weight:700;
  background:var(--butter-soft);color:var(--butter-ink);
}
.tag.warn{background:var(--danger-soft);color:var(--danger-ink)}

/* ---------- 添加按钮 ---------- */
.add{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;margin-top:16px;padding:15px;
  font-size:14px;font-weight:700;color:var(--pink-ink);
  background:transparent;
  border:2.5px dashed var(--pink);
  border-radius:var(--r);
  cursor:pointer;transition:.18s;
}
.add svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.add:hover{background:var(--pink-soft);box-shadow:var(--shadow-sm)}
.add:hover svg{transform:rotate(90deg) scale(1.15)}
.add:active{transform:scale(.99)}

/* ---------- 合计栏（贴纸小票） ---------- */
.summary{
  position:relative;              /* 胶带靠它定位，不能删 */
  display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;
  margin-top:30px;padding:14px 20px;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}
.summary::before,.summary::after{    /* 和纸胶带 */
  content:"";position:absolute;top:-11px;width:66px;height:23px;border-radius:5px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px),
    var(--tape);
  box-shadow:0 1px 3px rgba(88,64,70,.12);
}
.summary::before{left:26px;transform:rotate(-7deg)}
.summary::after{right:26px;transform:rotate(6deg)}

.sumi{display:flex;flex-direction:column;gap:0;min-width:0}
.sumi .k{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.6px}
.sumi .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sumi.total .v{font-size:26px;letter-spacing:-.5px;color:var(--pink-ink)}
.sumi.total .v .cur{font-size:15px;margin-right:1px}
.sum-actions{display:flex;gap:9px;margin-left:auto}

.btn{
  padding:10px 17px;white-space:nowrap;
  font-size:13.5px;font-weight:700;color:var(--ink);
  background:var(--card);
  border:2px solid var(--line);border-radius:15px;
  box-shadow:0 3px 0 var(--line);
  cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;
}
.btn:hover{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink);box-shadow:0 3px 0 #FFD3E3}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.btn.primary{
  color:var(--on-accent);background:var(--pink);border-color:var(--pink);
  box-shadow:0 3px 0 var(--pink-shadow);
}
.btn.primary:hover{background:var(--pink);border-color:var(--pink);color:var(--on-accent);box-shadow:0 3px 0 var(--pink-shadow);filter:brightness(1.04)}
.btn.primary:active{box-shadow:0 0 0 transparent}
.btn.armed{color:#fff;background:var(--danger);border-color:var(--danger);box-shadow:0 3px 0 #A83B37}
.btn.armed:active{box-shadow:0 0 0 transparent}

/* ---------- 出错提示 ---------- */
.fatal{
  margin:14px 0 0;padding:13px 16px;
  font-size:13px;line-height:1.65;font-weight:600;
  color:var(--danger-ink);background:var(--danger-soft);
  border:2px solid var(--danger);border-radius:16px;
}

/* ---------- 轻提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:9;
  padding:11px 22px;
  font-size:13.5px;font-weight:700;
  color:var(--on-accent);background:var(--pink);
  border-radius:999px;
  box-shadow:0 4px 0 var(--pink-shadow),0 14px 26px -14px rgba(232,100,143,.7);
  opacity:0;pointer-events:none;transform:translate(-50%,18px);
  transition:opacity .24s,transform .24s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 移动端 ============ */
@media (max-width:760px){
  body{font-size:14px}
  /* 16px 字号可防止 iOS 聚焦时自动放大页面 */
  .inp,.name{font-size:16px}
  .name{font-size:16.5px}
  .inp{padding:10px 12px}
  .t-start,.t-end{width:auto}
  .h-val{width:72px}
  .rate{width:88px}

  .sp1{right:4%;top:0;width:19px}
  .sp2,.sp3{display:none}

  .brand{margin-bottom:11px}
  .brand-tag{font-size:15px;letter-spacing:2px;padding:5px 12px 6px 14px}
  .mascot{width:64px;height:64px;border-radius:19px}

  .row{grid-template-columns:minmax(0,1fr);padding:15px;gap:13px}
  .row-out{
    grid-column:1;grid-row:auto;
    flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;
    text-align:left;gap:4px 10px;padding:12px 14px 12px 24px;
  }
  .out-tags{flex-basis:100%;justify-content:flex-start}
  .out-amt{transform-origin:left center}

  /* 时段两格撑满整行，避免横向溢出 */
  .range-only{width:100%}
  .range-only .t-start,.range-only .t-end{flex:1 1 0;width:auto;min-width:0}
  .row-ctrl{gap:12px 14px}

  /* 更大的点按区域 */
  .seg-btn{padding:8px 15px;font-size:13px}
  .mini{width:36px;height:36px;font-size:18px}
  .del{width:38px;height:38px}
  .badge{width:34px;height:34px}
  .btn{padding:13px 18px}
  .add{padding:17px}

  .summary{gap:10px 18px;padding:14px 16px;margin-top:30px}
  .sum-actions{width:100%;margin-left:0}
  .sum-actions .btn{flex:1}
  .sumi.total{margin-left:auto}
  .summary::before{left:16px}
  .summary::after{right:16px}
}
@media (max-width:400px){
  .rate{width:80px}
  .sumi .v{font-size:15px}
  .sumi.total .v{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<script>
/* 自检：1.5 秒后主脚本若仍未启动，说明文件不完整或脚本被拦截，直接把原因显示出来 */
window.__ok = false;
setTimeout(function(){
  if(window.__ok || !document.body) return;
  var p = document.createElement('p');
  p.className = 'fatal';
  p.textContent = '脚本没有执行。多半是文件没有传完整（末尾的模板和脚本丢了），或者浏览器拦截了 JavaScript。请重新复制一份完整的文件再打开。';
  document.body.appendChild(p);
}, 1500);
</script>
</head>
<body>
<div class="wrap">

  <svg class="sparkle sp1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.4 2.6 7.1 8 8-5.4.9-7.1 2.6-8 8-.9-5.4-2.6-7.1-8-8 5.4-.9 7.1-2.6 8-8z" fill="currentColor"/></svg>
  <svg class="sparkle sp2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.4 2.6 7.1 8 8-5.4.9-7.1 2.6-8 8-.9-5.4-2.6-7.1-8-8 5.4-.9 7.1-2.6 8-8z" fill="currentColor"/></svg>
  <svg class="sparkle sp3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.4 2.6 7.1 8 8-5.4.9-7.1 2.6-8 8-.9-5.4-2.6-7.1-8-8 5.4-.9 7.1-2.6 8-8z" fill="currentColor"/></svg>

  <div class="brand">
    <span class="brand-tag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.4 2.6 7.1 8 8-5.4.9-7.1 2.6-8 8-.9-5.4-2.6-7.1-8-8 5.4-.9 7.1-2.6 8-8z" fill="currentColor"/></svg>
      老虎专用
    </span>

    <h1>陪玩计费<span class="hl">小账本</span></h1>
  </header>

  <p class="hint">
    <span class="dot"></span>
    <span>结束时间早于开始时间时，会<b>自动按跨天</b>计算。</span>
  </p>

  <main>
    <div class="list" id="list"></div>
    <noscript>
      <p class="fatal">这个页面需要 JavaScript 才能计算金额。请在浏览器设置里开启 JavaScript（或换用系统自带浏览器）后重新打开。</p>
    </noscript>
    <button class="add" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      添加一位陪玩
    </button>
  </main>

  <section class="summary">
    <div class="sumi"><span class="k">人数</span><span class="v" id="sumCount">0 位</span></div>
    <div class="sumi"><span class="k">总时长</span><span class="v" id="sumHours">0 分钟</span></div>
    <div class="sumi total"><span class="k">合计金额</span><span class="v"><span class="cur">¥</span><span id="sumAmount">0.00</span></span></div>
    <div class="sum-actions">
      <button class="btn primary" id="copyBtn" type="button">复制账单</button>
      <button class="btn" id="clearBtn" type="button">清空</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="rowTpl">
  <article class="row" data-mode="range">
    <div class="row-main">
      <div class="row-top">
        <span class="badge">01</span>
        <input class="inp name" type="text" maxlength="16" placeholder="昵称 / 编号，如：小鹿" aria-label="陪玩昵称">
        <button class="del" type="button" title="删除这一行" aria-label="删除这一行">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="row-ctrl">
        <div class="seg" role="group" aria-label="计费方式">
          <button class="seg-btn on" type="button" data-mode="range">按时段</button>
          <button class="seg-btn" type="button" data-mode="hours">按时长</button>
        </div>

        <div class="fld range-only">
          <span class="lbl">开始</span>
          <input class="inp t-start" type="time" aria-label="开始时间">
          <span class="tilde">~</span>
          <input class="inp t-end" type="time" aria-label="结束时间">
        </div>

        <div class="fld hours-only" hidden>
          <span class="lbl">时长</span>
          <span class="step">
            <button class="mini minus" type="button" aria-label="减半小时">−</button>
            <input class="inp h-val" type="number" min="0" step="0.5" inputmode="decimal" placeholder="2.5" aria-label="小时数">
            <button class="mini plus" type="button" aria-label="加半小时">+</button>
          </span>
          <span class="unit">小时</span>
        </div>

        <label class="fld">
          <span class="lbl">单价</span>
          <input class="inp rate" type="number" min="0" step="1" inputmode="decimal" placeholder="80" aria-label="每小时单价">
          <span class="unit">元/时</span>
        </label>

        <label class="fld fld-note">
          <span class="lbl">备注</span>
          <input class="inp notev" type="text" maxlength="30" placeholder="选填，如：包夜、加钟" aria-label="备注">
        </label>
      </div>
    </div>

    <div class="row-out">
      <div class="out-dur">0 分钟</div>
      <div class="out-amt"><span class="cur">¥</span><span class="val">0.00</span></div>
      <div class="out-tags"></div>
    </div>
  </article>
</template>

<script>
(function(){
  'use strict';

  var KEY = 'peiwan-ledger-v1';
  var listEl = document.getElementById('list');
  var tpl = document.getElementById('rowTpl');

  /* ---------- 小工具 ---------- */
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function num(v, dft){
    var n = parseFloat(String(v == null ? '' : v).trim());
    return isFinite(n) ? n : (dft || 0);
  }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
  function group(n){                        // 1234.5 -> "1,234.50"
    var p = Math.abs(n).toFixed(2).split('.');
    return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
  }
  function trimNum(n){ return String(Math.round(n * 100) / 100); }
  function toMin(t){                        // "18:30" -> 1110
    var m = /^(\d{1,2}):(\d{2})/.exec(t || '');
    if(!m) return null;
    var h = +m[1], mi = +m[2];
    return (h < 24 && mi < 60) ? h * 60 + mi : null;
  }
  function fmtDur(h){                       // 4.5 -> "4 小时 30 分"
    var t = Math.round(h * 60);
    if(t <= 0) return '0 分钟';
    var H = Math.floor(t / 60), M = t % 60;
    if(!H) return M + ' 分钟';
    if(!M) return H + ' 小时';
    return H + ' 小时 ' + M + ' 分';
  }

  /* ---------- 计算 ---------- */
  function calc(row){
    var mode = row.dataset.mode || 'range';
    var rate = Math.max(0, num($('.rate', row).value));

    var hours = 0, cross = false, warn = '';

    if(mode === 'range'){
      var a = toMin($('.t-start', row).value), b = toMin($('.t-end', row).value);
      if(a === null || b === null){
        warn = '待填时间';
      }else{
        var d = b - a;
        if(d < 0){ d += 1440; cross = true; }   // 跨天
        else if(d === 0){ warn = '时段为 0'; }
        hours = d / 60;
      }
    }else{
      hours = Math.max(0, num($('.h-val', row).value));
    }

    var amount = round2(hours * rate);

    return { mode: mode, hours: hours, rate: rate, amount: amount, cross: cross, warn: warn };
  }

  function tagEl(text, cls){
    var s = document.createElement('span');
    s.className = 'tag' + (cls ? ' ' + cls : '');
    s.textContent = text;
    return s;
  }

  function paint(row, r){
    $('.out-dur', row).textContent = fmtDur(r.hours);

    var box = $('.out-amt', row);
    var val = $('.val', box);
    var txt = group(r.amount);
    if(val.textContent !== txt){
      var first = val.textContent === '0.00';
      val.textContent = txt;
      if(!first){                             // 数字变化时轻轻弹一下
        box.classList.remove('pop');
        void box.offsetWidth;
        box.classList.add('pop');
      }
    }

    var tags = $('.out-tags', row);
    tags.textContent = '';
    if(r.warn) tags.appendChild(tagEl(r.warn, 'warn'));
    if(r.cross) tags.appendChild(tagEl('跨天'));

    row.classList.toggle('has-val', r.amount > 0);
  }

  /* ---------- 刷新全部 ---------- */
  function refresh(){
    var rows = $$('.row', listEl);
    var totalH = 0, totalA = 0, people = 0;

    rows.forEach(function(row, i){
      $('.badge', row).textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
      var r = calc(row);
      paint(row, r);

      var named = $('.name', row).value.trim();
      if(named || r.hours > 0 || r.rate > 0) people++;

      totalH += r.hours;
      totalA = round2(totalA + r.amount);
    });

    $('#sumCount').textContent = people + ' 位';
    $('#sumHours').textContent = fmtDur(totalH);
    $('#sumAmount').textContent = group(totalA);
    save();
  }

  /* ---------- 存取 ---------- */
  function serialize(){
    return $$('.row', listEl).map(function(row){
      return {
        mode: row.dataset.mode,
        name: $('.name', row).value,
        start: $('.t-start', row).value,
        end: $('.t-end', row).value,
        hours: $('.h-val', row).value,
        rate: $('.rate', row).value,
        note: $('.notev', row).value
      };
    });
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  /* ---------- 行 ---------- */
  function applyMode(row){
    var mode = row.dataset.mode === 'hours' ? 'hours' : 'range';
    row.dataset.mode = mode;
    $$('.seg-btn', row).forEach(function(b){ b.classList.toggle('on', b.dataset.mode === mode); });
    $('.range-only', row).hidden = mode !== 'range';
    $('.hours-only', row).hidden = mode !== 'hours';
  }

  function addRow(data){
    var row = tpl.content.firstElementChild.cloneNode(true);
    if(data){
      row.dataset.mode = data.mode === 'hours' ? 'hours' : 'range';
      $('.name', row).value = data.name || '';
      $('.t-start', row).value = data.start || '';
      $('.t-end', row).value = data.end || '';
      $('.h-val', row).value = data.hours || '';
      $('.rate', row).value = data.rate || '';
      $('.notev', row).value = data.note || '';
    }
    applyMode(row);
    listEl.appendChild(row);
    return row;
  }

  function resetRow(row){
    ['name','h-val','rate','notev'].forEach(function(c){ $('.' + c, row).value = ''; });
    $('.t-start', row).value = '';
    $('.t-end', row).value = '';
    row.dataset.mode = 'range';
    applyMode(row);
  }

  /* ---------- 事件 ---------- */
  listEl.addEventListener('input', function(e){
    if(e.target.classList.contains('inp')) refresh();
  });

  listEl.addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.row') : null;
    if(!row) return;

    var seg = e.target.closest('.seg-btn');
    if(seg){ row.dataset.mode = seg.dataset.mode; applyMode(row); refresh(); return; }

    var mini = e.target.closest('.mini');
    if(mini){
      var inp = $('.h-val', row);
      var step = mini.classList.contains('plus') ? 0.5 : -0.5;
      var v = Math.max(0, round2(num(inp.value) + step));
      inp.value = v > 0 ? trimNum(v) : '';
      refresh();
      return;
    }

    if(e.target.closest('.del')){
      if($$('.row', listEl).length <= 1){
        resetRow(row);                        // 最后一行只清内容，保留结构
      }else{
        row.style.opacity = '0';
        row.style.transform = 'scale(.97)';
        setTimeout(function(){ row.remove(); refresh(); }, 150);
        return;
      }
      refresh();
    }
  });

  /* ---------- 添加 ---------- */
  document.getElementById('addBtn').addEventListener('click', function(){
    var rows = $$('.row', listEl);
    var last = rows[rows.length - 1];
    var row = addRow();
    if(last && last !== row){                 // 沿用上一行的单价，少填几次
      $('.rate', row).value = $('.rate', last).value;
    }
    refresh();
    $('.name', row).focus();
    if(row.scrollIntoView) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  /* ---------- 复制账单 ---------- */
  function buildBill(){
    var rows = $$('.row', listEl);
    var lines = ['🎮 陪玩计费单', '————————————'];
    var totalH = 0, totalA = 0, n = 0;

    rows.forEach(function(row){
      var r = calc(row);
      var name = $('.name', row).value.trim();
      var note = $('.notev', row).value.trim();
      if(!name && !r.hours && !r.rate) return;

      n++;
      var detail = r.mode === 'hours'
        ? trimNum(r.hours) + ' 小时'
        : ($('.t-start', row).value || '--:--') + '-' + ($('.t-end', row).value || '--:--') + (r.cross ? '(跨天)' : '');

      var line = n + '. ' + (name || '未命名') + '　' + detail + '　' + fmtDur(r.hours);
      if(r.rate > 0) line += '　单价 ¥' + trimNum(r.rate) + '/时';
      line += '　→ ¥' + group(r.amount);
      lines.push(line);
      if(note) lines.push('   备注：' + note);

      totalH += r.hours;
      totalA = round2(totalA + r.amount);
    });

    if(!n) return '';
    lines.push('————————————');
    lines.push('共 ' + n + ' 位　总时长 ' + fmtDur(totalH));
    lines.push('合计金额 ¥' + group(totalA));
    return lines.join('\n');
  }

  function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }catch(e){ return false; }
  }

  document.getElementById('copyBtn').addEventListener('click', function(){
    var bill = buildBill();
    if(!bill){ toast('还没有可复制的记录'); return; }
    copyText(bill).then(function(ok){
      toast(ok ? '账单已复制 ♡ 去粘贴吧' : '复制失败，请手动选中复制');
    });
  });

  /* ---------- 清空（点两次确认） ---------- */
  var clearBtn = document.getElementById('clearBtn');
  var armed = false, armTimer = null;
  function disarm(){
    armed = false;
    clearBtn.classList.remove('armed');
    clearBtn.textContent = '清空';
  }
  clearBtn.addEventListener('click', function(){
    if(!armed){
      armed = true;
      clearBtn.classList.add('armed');
      clearBtn.textContent = '再点一次清空';
      clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 3200);
      return;
    }
    clearTimeout(armTimer);
    disarm();
    listEl.textContent = '';
    addRow();
    refresh();
    toast('已清空，重新开始 ✧');
  });

  /* ---------- 轻提示 ---------- */
  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
  }

  /* ---------- 启动 ---------- */
  function showFatal(err){
    var p = document.createElement('p');
    p.className = 'fatal';
    p.textContent = '出错了：' + (err && err.message ? err.message : err) + ' —— 把这句话截图反馈即可定位问题。';
    var main = document.querySelector('main');
    (main || document.body).appendChild(p);
  }

  function boot(){
    var saved = load();
    if(saved && saved.length){
      saved.forEach(function(d){ addRow(d); });
    }else{
      addRow();
    }
    refresh();
  }

  try{
    boot();
  }catch(err){
    showFatal(err);
  }
  window.__ok = true;      // 告诉自检脚本：主脚本跑起来了
})();
</script>
</body>
</html>
